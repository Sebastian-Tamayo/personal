<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Finanzas Mati</title>
    <script>
      // Fallback SPA para GitHub Pages: reenvía la ruta al index.
      var path = location.pathname.split('/').slice(1).join('/')
      location.replace(
        location.origin +
          location.pathname.replace(/\/[^/]*$/, '/') +
          '?p=/' +
          encodeURIComponent('/' + path) +
          location.search.replace(/^\?/, '&') +
          location.hash
      )
    </script>
  </head>
  <body></body>
</html>
