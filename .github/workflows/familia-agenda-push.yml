# Closed-app mobile Web Push for Familia Hellen y Mati Agenda.
# Timezone: Europe/Madrid. Catch-up until event if primary window missed.
name: Familia agenda push reminders

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [familia-agenda-remind]

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Cron heartbeat
        run: |
          echo "event=${{ github.event_name }}"
          echo "utc=$(date -u -Iseconds)"
          echo "madrid=$(TZ=Europe/Madrid date -Iseconds)"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install sender deps
        working-directory: familia-mati
        run: npm install --no-save firebase-admin@13 web-push@3.6.7
      - name: Migrate teo → hellen profiles
        continue-on-error: true
        working-directory: familia-mati
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/migrate-teo-to-hellen.mjs
      - name: Send due reminders
        working-directory: familia-mati
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          REMINDER_TZ: Europe/Madrid
          REMINDER_WINDOW_MINUTES: '45'
        run: node scripts/send-agenda-reminders.mjs
