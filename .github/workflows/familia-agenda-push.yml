# Closed-app mobile Web Push for Familia Hellen y Mati.
# - Agenda citas/compromisos (lead time per profile)
# - Rutinas digest once/day at familia_settings/routinesDigest.time (default 16:00 Madrid → todos)
#
# Schedules use UTC (GitHub does not support TZ in cron).
# Europe/Madrid = UTC+1 (CET) / UTC+2 (CEST). Reminder math uses REMINDER_TZ.
# Catch-up window covers GitHub's common schedule delay under load.
# Production reliability: cron-job.org → repository_dispatch familia-agenda-remind (~5 min).
#
# Runs only from the default branch (main). Requires Actions enabled on the repo.
# Idempotent via familia_reminders_sent + familia_routines_digest_sent.
name: Familia agenda push reminders

on:
  schedule:
    # Primary: every 15 minutes (UTC)
    - cron: '0,15,30,45 * * * *'
    # Offset backup on the same workflow (independent scheduler registration)
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [familia-agenda-remind]

permissions:
  contents: read

concurrency:
  group: familia-agenda-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cron heartbeat
        run: |
          echo "event=${{ github.event_name }}"
          echo "utc=$(date -u -Iseconds)"
          echo "madrid=$(TZ=Europe/Madrid date -Iseconds)"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install sender deps
        working-directory: familia-mati
        run: npm install --no-save firebase-admin@13 web-push@3.6.7
      - name: Migrate teo → hellen profiles
        continue-on-error: true
        working-directory: familia-mati
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/migrate-teo-to-hellen.mjs
      - name: Send due reminders (+ rutinas 16:00 digest)
        working-directory: familia-mati
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          REMINDER_TZ: Europe/Madrid
          REMINDER_WINDOW_MINUTES: '60'
          # Fallback only — live clock is familia_settings/routinesDigest.time (Rutinas-only)
          ROUTINES_DIGEST_TIME: '16:00'
          ROUTINES_DIGEST_WINDOW_MINUTES: '12'
        run: node scripts/send-agenda-reminders.mjs
