name: Familia verify Sebas push
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: familia-mati
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save firebase-admin@13 web-push@3.6.7
      - name: Verify Sebas push
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/verify-sebas-push.mjs
      - name: Optional test push to Sebas only
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          node <<'NODE'
          const admin = require('firebase-admin')
          const webpush = require('web-push')
          const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON)
          admin.initializeApp({ credential: admin.credential.cert(sa) })
          webpush.setVapidDetails(
            process.env.VAPID_SUBJECT || 'mailto:familia@localhost',
            process.env.VAPID_PUBLIC_KEY,
            process.env.VAPID_PRIVATE_KEY,
          )
          ;(async () => {
            const snap = await admin.firestore().collection('familia_push_subs').get()
            const targets = []
            for (const doc of snap.docs) {
              const d = doc.data() || {}
              if (String(d.memberKey || '').toLowerCase() !== 'sebas') continue
              if (d.enabled === false || d.dead || d.personaMirror || d.legacyUidDoc) continue
              if (!d.endpoint || !d.keys?.p256dh || !d.keys?.auth) continue
              targets.push({ id: doc.id, endpoint: d.endpoint, keys: d.keys, uid: d.uid })
            }
            if (!targets.length) {
              console.log(JSON.stringify({ testPush: 'skipped', reason: 'no_active_sebas_sub' }))
              return
            }
            const payload = JSON.stringify({
              title: 'Familia Hellen y Mati · prueba',
              body: 'Test Sebas: si ves esto, los avisos están activos.',
              url: '/personal/familia/',
              tag: 'test-sebas-' + Date.now(),
            })
            const results = []
            for (const t of targets) {
              try {
                await webpush.sendNotification(
                  { endpoint: t.endpoint, keys: { p256dh: t.keys.p256dh, auth: t.keys.auth } },
                  payload,
                )
                results.push({ id: t.id.slice(0, 12) + '…', ok: true })
              } catch (e) {
                results.push({ id: t.id.slice(0, 12) + '…', ok: false, status: e.statusCode || null })
                if (e.statusCode === 404 || e.statusCode === 410) {
                  await admin.firestore().collection('familia_push_subs').doc(t.id).set(
                    { enabled: false, dead: true },
                    { merge: true },
                  )
                }
              }
            }
            console.log(JSON.stringify({ testPush: 'done', sent: results.filter((r) => r.ok).length, results }))
          })().catch((e) => { console.error(e); process.exit(1) })
          NODE

