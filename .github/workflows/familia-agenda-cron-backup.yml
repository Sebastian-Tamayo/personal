# Independent schedule registration that re-triggers the reminders workflow.
# GitHub sometimes skips a scheduled workflow for hours; a second workflow with
# a different cron + workflow_dispatch ping raises the odds a tick lands.
#
# Safe to overlap: send-agenda-reminders.mjs is idempotent (familia_reminders_sent).
name: Familia agenda cron backup ping

on:
  schedule:
    # Dense backup: GH schedule gaps of hours have missed lead windows (e.g. 09:30 Madrid).
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: familia-agenda-cron-backup
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Heartbeat
        run: |
          echo "event=${{ github.event_name }}"
          echo "utc=$(date -u -Iseconds)"
          echo "madrid=$(TZ=Europe/Madrid date -Iseconds)"
      - name: Dispatch agenda reminders
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Familia agenda reminders scheduled" \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}" \
          || gh workflow run familia-agenda-reminders-scheduled.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}" \
          || gh workflow run familia-agenda-push.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}"
          echo "dispatched agenda reminders on ${{ github.event.repository.default_branch }}"
