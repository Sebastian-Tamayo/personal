# Closed-app mobile Web Push for Familia Mati Agenda (citas/compromisos) — NOT email,
# NOT tareas diarias (chores). Fires ~every 15 min; per-profile leadMinutes + assignee targeting.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT_JSON  — full JSON of a Firebase Admin SDK service account
#   VAPID_PUBLIC_KEY               — same public key as VITE_VAPID_PUBLIC_KEY in the client build
#   VAPID_PRIVATE_KEY              — matching private key (never in the client or docs)
# Optional:
#   VAPID_SUBJECT                  — e.g. mailto:you@example.com
name: Familia agenda push reminders

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: familia-mati
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install sender deps
        run: npm install --no-save firebase-admin@13 web-push@3.6.7
      - name: Send due reminders
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          REMINDER_TZ: Europe/Madrid
          REMINDER_WINDOW_MINUTES: '20'
        run: node scripts/send-agenda-reminders.mjs
